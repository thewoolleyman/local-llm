# llama-swap fleet router for the homelab user on macmini.
#
# Peer model IDs are exposed as <peer>/<model>, for example:
#   macmini/qwen3-coder-next
#   m4max/qwen3-coder-next
#   gmktec/qwen3-coder-next
#
# Add future Tailscale-hosted llama-server instances under `peers`.
# Keep credentials in /Users/homelab/.config/llama-swap/secrets.env, not here.

healthCheckTimeout: 120
logLevel: info

apiKeys:
  - "${env.CODEX_LOCAL_ROUTER_KEY}"

peers:
  macmini:
    proxy: "http://100.99.172.34:8080"
    apiKey: "${env.MACMINI_LLAMA_KEY}"
    models:
      - qwen3-coder-next

  m4max:
    proxy: "http://100.125.10.110:8080"
    apiKey: "${env.M4MAX_LLAMA_KEY}"
    models:
      - qwen3-coder-next

  gmktec:
    proxy: "http://100.79.195.82:8080"
    apiKey: "${env.GMKTEC_LLAMA_KEY}"
    models:
      - qwen3-coder-next

  # Future peer example:
  # another-host:
  #   proxy: "http://100.x.y.z:8080"
  #   apiKey: "${env.ANOTHER_HOST_LLAMA_KEY}"
  #   models:
  #     - model-id
